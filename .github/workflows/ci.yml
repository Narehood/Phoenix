name: Phoenix Linux validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      dependency_refresh:
        description: Resolve dependency manifests for review instead of running fixtures
        type: boolean
        default: false
      publish_release:
        description: Publish a testing prerelease from a successful main build
        type: boolean
        default: false
      release_tag:
        description: Existing testing tag, for example v0.1.0-rc.1
        type: string
      source_run:
        description: Successful main Linux validation run ID to promote
        type: string
permissions:
  contents: read
concurrency:
  group: phoenix-validation-${{ github.ref }}-${{ inputs.publish_release && 'release' || inputs.dependency_refresh && 'dependencies' || 'checks' }}
  cancel-in-progress: ${{ !inputs.publish_release }}
jobs:
  dependency-refresh:
    if: github.event_name == 'workflow_dispatch' && inputs.dependency_refresh && !inputs.publish_release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOCACHE: ${{ github.workspace }}/.validation/go-build
      NPM_CONFIG_CACHE: ${{ github.workspace }}/.validation/npm-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.0'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: false
      - name: Resolve current stable dependencies without running application code
        run: |
          python3 scripts/validate.py --timeout 180 -- npm install --global npm@12.2.2 --ignore-scripts --no-audit --no-fund
          python3 scripts/validate.py --timeout 600 -- python3 scripts/refresh_dependencies.py
      - name: Retain manifests and audit evidence for review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: phoenix-dependency-refresh
          include-hidden-files: true
          path: |
            web/package.json
            web/package-lock.json
            go.mod
            go.sum
            .validation/dependency-refresh.json
          if-no-files-found: error
          retention-days: 7
  publish-release:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      SOURCE_RUN: ${{ inputs.source_run }}
      DOCKER_CONFIG: ${{ github.workspace }}/.validation/release-docker-config
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Exercise release checksum and archive guards
        run: python3 scripts/validate.py --timeout 60 -- python3 -m unittest discover -s scripts -p test_prepare_release.py
      - name: Verify and prepare the exact tested build
        run: python3 scripts/validate.py --timeout 180 -- python3 scripts/prepare_release.py prepare "$SOURCE_RUN" "$RELEASE_TAG"
      # Publishing is an explicitly requested external operation, not validation.
      - name: Publish and pull back versioned container images
        run: |
          IMAGE=$(jq -r .image .validation/release-assets/release-manifest.json)
          EXPECTED=$(docker image inspect --format '{{json .Config}} {{json .RootFS}} {{.Os}}/{{.Architecture}}' "$IMAGE")
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push --platform linux/amd64 "$IMAGE"
          docker pull --platform linux/amd64 "$IMAGE"
          test "$(docker image inspect --format '{{json .Config}} {{json .RootFS}} {{.Os}}/{{.Architecture}}' "$IMAGE")" = "$EXPECTED"
          docker tag "$IMAGE" ghcr.io/narehood/phoenix:testing
          docker push --platform linux/amd64 ghcr.io/narehood/phoenix:testing
      - name: Record the verified registry digest
        run: python3 scripts/validate.py --timeout 30 -- python3 scripts/prepare_release.py registry "$SOURCE_RUN" "$RELEASE_TAG"
      - name: Upload and verify assets before publishing the prerelease
        run: |
          SOURCE=$(jq -r .sourceSha .validation/release-assets/release-manifest.json)
          gh release create "$RELEASE_TAG" .validation/release-assets/* --repo "$GITHUB_REPOSITORY" --verify-tag --target "$SOURCE" --title "Phoenix $RELEASE_TAG — Debian testing" --notes-file .validation/release-notes.md --draft --prerelease --latest=false
          python3 scripts/prepare_release.py verify "$SOURCE_RUN" "$RELEASE_TAG"
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease --latest=false
      - name: Remove temporary registry credentials
        if: always()
        run: docker logout ghcr.io
  debian-fixtures:
    name: ${{ inputs.dependency_refresh && 'Dependency refresh (validation skipped)' || 'debian-fixtures' }}
    if: github.event_name != 'workflow_dispatch' || (!inputs.dependency_refresh && !inputs.publish_release)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fixture, authorization, mTLS, job and race checks in Debian container
        run: python3 scripts/validate.py --timeout 600 -- docker build --pull --target validate --progress=plain .
      - name: Server image, React bundle and unprivileged binary smoke
        run: python3 scripts/validate.py --timeout 300 -- docker build --pull --target server --progress=plain -t phoenix:ci .
      - name: Dashboard browser regression fixtures
        # Retain production timers for conflict, revocation and session-expiry flows.
        run: python3 scripts/validate.py --timeout 240 -- node scripts/browser-fixtures.mjs
      - name: Export and package the tested Linux kit
        run: |
          python3 scripts/validate.py --timeout 300 -- docker build --target test-kit --output type=local,dest=.validation/test-kit .
          python3 scripts/validate.py --timeout 120 -- python3 scripts/test_kit.py "$GITHUB_SHA"
      - name: Retain development test kit
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: phoenix-linux-amd64-test-kit
          path: .validation/test-kit-artifact/
          if-no-files-found: error
          retention-days: 7
      - name: Export the tested development server image
        run: python3 scripts/validate.py --timeout 180 -- python3 scripts/export_image.py "$GITHUB_SHA"
      - name: Retain checksummed server image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: phoenix-linux-amd64-server-image
          path: .validation/server-image-artifact/
          if-no-files-found: error
          retention-days: 7
      - name: Retain bounded browser evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: phoenix-browser-evidence
          path: .validation/browser-evidence/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
